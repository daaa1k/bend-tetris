<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <title>BEND / TETRIS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">PARALLEL LOGIC / CLASSIC PLAY</p>
        <h1><span>BEND</span><i>/</i>TETRIS</h1>
      </div>
      <div class="runtime"><span></span>BEND 2 · LIVE</div>
    </header>

    <section class="game-layout" aria-label="Bend Tetris">
      <aside class="panel left-panel">
        <div class="stat"><small>SCORE</small><strong id="score">000000</strong></div>
        <div class="stat"><small>LINES</small><strong id="lines">00</strong></div>
        <div class="stat"><small>LEVEL</small><strong id="level">00</strong></div>
        <div class="divider"></div>
        <div class="mini-title">HOLD</div>
        <canvas id="hold" width="128" height="96" aria-label="ホールド中のミノ"></canvas>
      </aside>

      <div class="board-wrap">
        <canvas id="board" width="320" height="640" aria-label="テトリス盤面"></canvas>
        <div id="overlay" class="overlay">
          <p class="overlay-kicker">BEND COMPUTE CORE</p>
          <h2 id="overlay-title">READY?</h2>
          <p id="overlay-copy">Enter またはタップでスタート</p>
          <button id="start" type="button">START GAME</button>
        </div>
      </div>

      <aside class="panel right-panel">
        <div class="mini-title">NEXT</div>
        <div id="next-list" class="next-list"></div>
        <div class="divider"></div>
        <div class="controls">
          <div><kbd>←</kbd><kbd>→</kbd><span>MOVE</span></div>
          <div><kbd>↑</kbd><span>ROTATE</span></div>
          <div><kbd>↓</kbd><span>SOFT DROP</span></div>
          <div><kbd>SPACE</kbd><span>HARD DROP</span></div>
          <div><kbd>C</kbd><span>HOLD</span></div>
          <div><kbd>P</kbd><span>PAUSE</span></div>
        </div>
      </aside>
    </section>

    <nav class="touch" aria-label="タッチ操作">
      <button data-action="left" aria-label="左へ">←</button>
      <button data-action="rotate" aria-label="回転">↻</button>
      <button data-action="right" aria-label="右へ">→</button>
      <button data-action="down" aria-label="下へ">↓</button>
      <button data-action="drop" class="wide" aria-label="ハードドロップ">DROP</button>
      <button data-action="hold" aria-label="ホールド">HOLD</button>
    </nav>

    <footer>GAME RULES COMPILED FROM <b>BEND</b> · 10 × 20 MATRIX · 7-BAG RANDOMIZER</footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
